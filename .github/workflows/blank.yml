name: Extract to Root

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract ZIP
        run: |
          unzip -o nova-multipurpose.zip -d temp_extract/
          echo "--- Extracted structure ---"
          find temp_extract/ -maxdepth 3 -type f | head -30

      - name: Move nova contents to root
        run: |
          shopt -s dotglob
          cp -r temp_extract/nova-multipurpose/nova/* .
          rm -rf temp_extract/
          rm -f nova-multipurpose.zip

      - name: Commit and push
        run: |
          git config user.name 
